name: remnawave-dns-guard

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:-mitetenov/remnawave-dns-guard-backend:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - guard-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "/dns-guard", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-mitetenov/remnawave-dns-guard-frontend:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 128m
    pids_limit: 128
    logging: *logging

volumes:
  guard-data:
